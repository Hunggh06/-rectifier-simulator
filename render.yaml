# Render Blueprint — Static Site (không backend, free, không sleep)
# Trong Render: New + → Blueprint → chọn repo này → Apply
services:
  - type: static
    name: rectifier-simulator
    runtime: static
    region: singapore
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
